<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Công việc được chia sẻ · WorkTree X</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/src/design-system/tokens.css">
  <link rel="stylesheet" href="/src/design-system/typography.css?v=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .share-shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
    }
    .share-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
    }
    .share-header-inner {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--brand-mark-bg);
      color: var(--brand-mark-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-mark svg { width: 24px; height: 24px; }
    .brand-meta {
      min-width: 0;
    }
    .brand-title {
      font-size: var(--text-mobile-base);
      font-weight: var(--weight-brand);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 4px 8px;
      flex-wrap: wrap;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .theme-toggle { padding: 0; width: 36px; flex: none; color: var(--muted); }
    .theme-sun, html[data-theme="dark"] .theme-moon { display: none; }
    html[data-theme="dark"] .theme-sun { display: block; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-3);
      color: var(--text);
    }
    .badge.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
    .badge.primary { background: var(--primary-soft); color: var(--primary-text); }
    .badge.green { background: var(--green-soft); color: var(--green); }
    .badge.amber { background: var(--amber-soft); color: var(--amber); }
    .badge.red { background: var(--red-soft); color: var(--red); }
    .badge.blue { background: var(--blue-soft); color: var(--blue); }
    .btn {
      min-height: 36px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background .15s ease, border-color .15s ease;
    }
    .btn:hover:not(:disabled) { background: var(--surface-3); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn.primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .share-main {
      width: 100%;
      max-width: 880px;
      margin: 20px auto 0;
      min-width: 0;
      padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      padding: 20px;
      box-shadow: var(--shadow);
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .task-panel { padding: 24px; }
    .task-top { display: flex; align-items: center; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
    .task-heading + .task-top { margin-top: 10px; }
    .panel-title {
      font-size: var(--text-md);
      font-weight: var(--weight-strong);
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .section-meta { font-weight: var(--weight-medium); }
    .task-heading {
      font-size: var(--text-page-title);
      font-weight: var(--weight-strong);
      letter-spacing: var(--tracking-title);
      line-height: var(--leading-title);
      margin: 0;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 12px 14px;
      margin: 16px 0 0;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
    }
    .meta-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .meta-label {
      font-size: var(--text-label);
      font-weight: 600;
      color: var(--muted);
    }
    .meta-value {
      margin: 0;
      font-size: var(--text-control);
      font-weight: 600;
    }
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-bar {
      flex: 1;
      height: 5px;
      border-radius: var(--radius-pill);
      background: var(--surface-3);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: var(--radius-pill);
      transition: width .2s ease;
    }
    .progress-fill.done { background: var(--green); }
    .description-box {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: var(--text-mobile-base);
      color: var(--text);
      margin: 0;
    }
    .muted { color: var(--muted); font-size: var(--text-label); }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .tag-chip {
      padding: 3px 9px;
      border-radius: var(--radius-xs);
      background: var(--surface-3);
      font-size: 12px;
      color: var(--muted);
    }
    .checklist-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .checklist-item {
      display: flex;
      font-size: var(--text-control);
      border-top: 1px solid var(--line);
    }
    .checklist-item > label, .checklist-item > .checklist-static {
      display: flex; align-items: center; gap: 10px; min-width: 0; width: 100%; min-height: 42px; padding: 8px 0;
    }
    .checklist-item > label { cursor: pointer; }
    .checklist-mark { display: grid; place-items: center; flex: none; width: 18px; height: 18px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--primary-text); }
    .is-done .checklist-mark { background: var(--primary-soft); border-color: var(--primary-soft); }
    .checklist-mark .icon { width: 13px; height: 13px; }
    .checklist-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      flex: none;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .checklist-item.is-done .checklist-text {
      text-decoration: line-through;
      color: var(--muted);
    }
    .inline-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      padding: 9px 12px;
      font-size: var(--text-entry);
    }
    .inline-form .input { flex: 1; min-width: 180px; }
    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .comment-item {
      padding: 12px;
      border-radius: var(--radius-lg);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .comment-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .comment-body {
      margin: 0;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .compose-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .error-banner {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--red-soft);
      color: var(--red);
      font-size: 13px;
      font-weight: 500;
    }
    .ok-banner {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--green-soft);
      color: var(--green);
      font-size: 13px;
      font-weight: 500;
    }
    .center-state {
      width: min(100%, 480px);
      margin: 48px auto;
      text-align: center;
      padding: 28px 22px;
    }
    .center-state .panel-title { justify-content: center; }
    .pin-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      text-align: left;
    }
    .controls-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: end;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .form-field { display: grid; gap: 4px; min-width: 0; font-size: var(--text-label); font-weight: var(--weight-semibold); }
    .form-actions { display: flex; justify-content: flex-end; }
    .attachment-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .attachment-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: var(--radius-md);
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 12px;
    }
    @media (max-width: 900px) {
      .btn, .select, .input { min-height: 44px; }
      .theme-toggle { width: 44px; }
      .panel { padding: 16px; }
      .checklist-item > label { min-height: 44px; }
    }
    @media (max-width: 620px) {
      .share-header { position: static; }
      .share-header-inner { flex-wrap: wrap; }
      .brand-group { flex: 1 1 100%; }
      .brand-meta { overflow-wrap: anywhere; }
      .header-actions { justify-content: space-between; width: 100%; }
      .share-main { margin-top: 14px; gap: 12px; }
      .meta-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .controls-row { grid-template-columns: minmax(0, 1fr); }
      .comment-head { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn, .progress-fill { transition: none; }
    }
  </style>
</head>
<body>
  <div class="share-shell">
    <header class="share-header">
      <div class="share-header-inner">
        <div class="brand-group">
          <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M7 8v9a6 6 0 006 6h12M16 5v18M25 10v13" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="7" cy="7" r="3" fill="currentColor"/><circle cx="16" cy="6" r="3" fill="currentColor"/><circle cx="25" cy="10" r="3" fill="currentColor"/></svg></div>
          <div class="brand-meta">
            <p class="brand-title">
              <span>WorkTree X</span>
              <span class="badge" id="orgBadge">Đang tải...</span>
            </p>
            <p class="brand-sub" id="shareSubtitle">Công việc được chia sẻ</p>
          </div>
        </div>
        <div class="header-actions">
          <span class="badge primary" id="permBadge" hidden></span>
          <button type="button" class="btn theme-toggle" id="themeBtn" aria-label="Chuyển giao diện sáng tối">
            <svg class="icon theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="share-main" id="shareRoot">
      <div class="panel center-state">
        <p class="muted">Đang tải dữ liệu công việc được chia sẻ...</p>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const root = document.getElementById('shareRoot');
      const orgBadge = document.getElementById('orgBadge');
      const permBadge = document.getElementById('permBadge');
      const shareSubtitle = document.getElementById('shareSubtitle');
      const themeBtn = document.getElementById('themeBtn');

      const STATUS_LABEL = {
        todo: 'Chưa làm',
        in_progress: 'Đang làm',
        review: 'Chờ duyệt',
        done: 'Hoàn thành'
      };
      const PRIORITY_LABEL = {
        urgent: 'Khẩn cấp',
        high: 'Cao',
        medium: 'Trung bình',
        low: 'Thấp'
      };
      const PERMISSION_LABEL = {
        view: 'Chỉ xem',
        comment: 'Xem và phản hồi',
        edit_progress: 'Cập nhật tiến độ'
      };

      function esc(v) {
        return String(v == null ? '' : v)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getTokenFromUrl() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('token')) return params.get('token').trim();
        const parts = window.location.pathname.split('/').filter(Boolean);
        if (parts[0] === 's' && parts[1]) return decodeURIComponent(parts[1]).trim();
        return '';
      }

      const token = getTokenFromUrl();
      let unlockedPin = token ? (sessionStorage.getItem(`wt_share_pin:${token}`) || '') : '';
      let guestName = localStorage.getItem('worktree_share_guest_name') || '';
      let currentData = null;
      let statusBanner = '';

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        localStorage.setItem('worktree_share_theme', document.documentElement.dataset.theme);
        const label = theme === 'dark' ? 'Bật giao diện sáng' : 'Bật giao diện tối';
        themeBtn.setAttribute('aria-label', label);
        themeBtn.title = label;
      }
      applyTheme(localStorage.getItem('worktree_share_theme') || 'light');
      themeBtn.addEventListener('click', () => {
        applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      });

      function formatSize(bytes) {
        const b = Number(bytes || 0);
        if (b < 1024) return `${b} B`;
        if (b < 1024 * 1024) return `${(b / 1024).toFixed(1)} KB`;
        return `${(b / (1024 * 1024)).toFixed(1)} MB`;
      }

      function formatTime(iso) {
        if (!iso) return '';
        const date = new Date(iso);
        return Number.isNaN(date.getTime()) ? '' : new Intl.DateTimeFormat('vi-VN', { dateStyle: 'short', timeStyle: 'short' }).format(date);
      }

      function formatDueDate(value) {
        const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || '');
        return parts ? `${parts[3]}/${parts[2]}/${parts[1]}` : value || 'Chưa đặt hạn';
      }

      function renderNotFound(msg) {
        orgBadge.textContent = 'Không khả dụng';
        permBadge.hidden = true;
        shareSubtitle.textContent = 'Liên kết hết hạn hoặc đã thu hồi';
        root.innerHTML = `
          <div class="panel center-state" role="alert">
            <h1 class="panel-title">Liên kết không khả dụng</h1>
            <p class="muted" style="margin:0 0 16px;">${esc(msg || 'Liên kết chia sẻ này có thể đã hết hạn, bị thu hồi bởi quản trị viên, hoặc đường dẫn không đúng.')}</p>
            <button type="button" class="btn" id="retryLoadBtn">Thử tải lại</button>
          </div>
        `;
        document.getElementById('retryLoadBtn')?.addEventListener('click', loadShare);
      }

      function renderPinGate(share, errorText = '') {
        orgBadge.textContent = share.organizationName || 'WorkTree X';
        permBadge.hidden = false;
        permBadge.textContent = PERMISSION_LABEL[share.permission] || share.permission;
        shareSubtitle.textContent = 'Liên kết được bảo vệ bằng mã PIN';
        root.innerHTML = `
          <div class="panel center-state">
            <h1 class="panel-title">Nhập mã PIN để xem công việc</h1>
            <p class="muted" style="margin:0;">${esc(share.label || 'Tài liệu công việc chia sẻ ngoài')}</p>
            <form class="pin-form" id="pinForm">
              ${errorText ? `<div class="error-banner" role="alert">${esc(errorText)}</div>` : ''}
              <input class="input" id="pinInput" type="password" inputmode="numeric" autocomplete="off" required maxlength="12" placeholder="Nhập mã PIN" aria-label="Mã PIN">
              <button class="btn primary" type="submit">Mở công việc</button>
            </form>
          </div>
        `;
        document.getElementById('pinForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const val = document.getElementById('pinInput')?.value.trim() || '';
          if (!val) return;
          unlockedPin = val;
          sessionStorage.setItem(`wt_share_pin:${token}`, val);
          await loadShare(true);
        });
      }

      function renderTaskView(data) {
        currentData = data;
        const { share, task, checklist = [], comments = [], attachments = [] } = data;
        const canComment = share.permission === 'comment' || share.permission === 'edit_progress';
        const canChecklist = canComment && Boolean(share.allowChecklistToggle);
        const canEditProgress = share.permission === 'edit_progress';
        const progress = Math.min(100, Math.max(0, Number(task.progress) || 0));

        orgBadge.textContent = share.organizationName || 'WorkTree X';
        permBadge.hidden = false;
        permBadge.textContent = PERMISSION_LABEL[share.permission] || share.permission;
        shareSubtitle.textContent = share.expiresAt
          ? `Hết hạn ${formatTime(share.expiresAt)}`
          : 'Liên kết không giới hạn thời hạn';

        const statusBadgeClass = task.status === 'done'
          ? 'green'
          : (task.status === 'review' ? 'amber' : (task.status === 'in_progress' ? 'blue' : ''));

        root.innerHTML = `
          ${statusBanner ? `<div class="${statusBanner.type === 'error' ? 'error-banner' : 'ok-banner'}" role="status">${esc(statusBanner.text)}</div>` : ''}
          <section class="panel task-panel" aria-labelledby="sharedTaskTitle">
            <h1 class="task-heading" id="sharedTaskTitle">${esc(task.title)}</h1>
            <div class="task-top">
              <span class="badge status ${statusBadgeClass}">${esc(STATUS_LABEL[task.status] || task.status)}</span>
              ${task.updatedAt ? `<time class="muted" datetime="${esc(task.updatedAt)}">Cập nhật ${esc(formatTime(task.updatedAt))}</time>` : ''}
            </div>
            <dl class="meta-grid">
              <div class="meta-cell">
                <dt class="meta-label">Ưu tiên</dt>
                <dd class="meta-value">${esc(PRIORITY_LABEL[task.priority] || task.priority)}</dd>
              </div>
              <div class="meta-cell">
                <dt class="meta-label">Phụ trách</dt>
                <dd class="meta-value">${esc(task.primaryAssigneeName || 'Chưa phân công')}</dd>
              </div>
              <div class="meta-cell">
                <dt class="meta-label">Thời hạn</dt>
                <dd class="meta-value">${esc(formatDueDate(task.dueDate))}</dd>
              </div>
              <div class="meta-cell">
                <dt class="meta-label">Tiến độ</dt>
                <dd class="meta-value progress-wrap">
                  <div class="progress-bar" role="progressbar" aria-label="Tiến độ công việc" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><div class="progress-fill ${task.status === 'done' ? 'done' : ''}" style="width:${progress}%"></div></div>
                  <span aria-hidden="true">${progress}%</span>
                </dd>
              </div>
            </dl>
            ${task.tags && task.tags.length ? `<div class="tag-row">${task.tags.map(tg => `<span class="tag-chip">${esc(tg)}</span>`).join('')}</div>` : ''}
            ${canEditProgress ? `
              <form class="controls-row" id="progressForm">
                <label class="form-field">
                  <span>Trạng thái</span>
                  <select class="select" id="guestStatusSelect">
                    ${Object.entries(STATUS_LABEL).map(([k, lbl]) => `<option value="${k}" ${task.status === k ? 'selected' : ''}>${esc(lbl)}</option>`).join('')}
                  </select>
                </label>
                <label class="form-field">
                  <span>Tiến độ (%)</span>
                  <input class="input" id="guestProgressInput" type="number" min="0" max="100" value="${progress}">
                </label>
                <label class="form-field">Tên của bạn <input class="input" id="progressGuestName" maxlength="80" value="${esc(guestName)}"></label>
                <div class="form-actions"><button class="btn primary" type="submit">Cập nhật tiến độ</button></div>
              </form>
            ` : ''}
          </section>

          <section class="panel">
            <h2 class="panel-title">Mô tả công việc</h2>
            <p class="description-box">${task.description ? esc(task.description) : '<span class="muted">Chưa có mô tả chi tiết.</span>'}</p>
          </section>

          <section class="panel">
            <h2 class="panel-title">
              <span>Checklist</span>
              <span class="muted section-meta">${Number(task.checklistDone || 0)}/${Number(task.checklistTotal || 0)} đã xong</span>
            </h2>
            ${checklist.length ? `
              <ul class="checklist-list">
                ${checklist.map(item => `
                  <li class="checklist-item ${item.isDone ? 'is-done' : ''}">
                    ${canChecklist ? `<label><input type="checkbox" data-checklist-id="${esc(item.id)}" ${item.isDone ? 'checked' : ''}>
                      <span class="checklist-text">${esc(item.content)}</span></label>` : `
                      <div class="checklist-static">
                        <span class="checklist-mark" role="img" aria-label="${item.isDone ? 'Đã xong' : 'Chưa xong'}">${item.isDone ? '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>' : ''}</span>
                        <span class="checklist-text">${esc(item.content)}</span>
                      </div>`}
                  </li>
                `).join('')}
              </ul>
            ` : '<p class="muted" style="margin:0;">Chưa có mục checklist.</p>'}
            ${canChecklist ? `
              <form class="inline-form" id="addChecklistForm">
                <input class="input" id="newChecklistInput" maxlength="400" required placeholder="Thêm một bước" aria-label="Nội dung mục checklist">
                <button class="btn" type="submit">Thêm mục</button>
              </form>
            ` : ''}
          </section>

          ${attachments.length ? `
            <section class="panel">
              <h2 class="panel-title">Tệp đính kèm (${attachments.length})</h2>
              <div class="attachment-list">
                ${attachments.map(a => `<span class="attachment-pill">${esc(a.originalName)} <span class="muted">(${esc(formatSize(a.sizeBytes))})</span></span>`).join('')}
              </div>
              <p class="muted" style="margin:8px 0 0;font-size:12px;">Vì lý do bảo mật, tệp đính kèm nội bộ được bảo vệ và không tải trực tiếp từ liên kết công khai.</p>
            </section>
          ` : ''}

          <section class="panel">
            <h2 class="panel-title">
              <span>Trao đổi (${comments.length})</span>
              ${share.hideInternalComments ? '<span class="badge">Chỉ hiện trao đổi công khai</span>' : ''}
            </h2>
            <div class="comment-list">
              ${comments.length ? comments.map(c => `
                <article class="comment-item">
                  <div class="comment-head">
                    <strong>${esc(c.authorName)}</strong>
                    <span class="muted">${esc(formatTime(c.createdAt))}</span>
                  </div>
                  <p class="comment-body">${esc(c.body)}</p>
                </article>
              `).join('') : '<p class="muted" style="margin:0;">Chưa có trao đổi công khai nào.</p>'}
            </div>
            ${canComment ? `
              <form class="compose-grid" id="commentForm">
                <label class="form-field">Tên của bạn hoặc công ty <input class="input" id="guestNameInput" required maxlength="80" value="${esc(guestName)}"></label>
                <label class="form-field">Phản hồi <textarea class="textarea" id="guestCommentInput" required maxlength="5000" rows="3" placeholder="Nhập nội dung phản hồi"></textarea></label>
                <div class="form-actions">
                  <button class="btn primary" type="submit">Gửi phản hồi</button>
                </div>
              </form>
            ` : ''}
          </section>
        `;

        bindInteractiveHandlers();
      }

      function setBanner(type, text) {
        statusBanner = { type, text };
      }

      async function postGuest(payload) {
        const res = await fetch(`/api/share?token=${encodeURIComponent(token)}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(unlockedPin ? { 'X-Share-Pin': unlockedPin } : {})
          },
          body: JSON.stringify({ token, pin: unlockedPin || undefined, ...payload })
        });
        const data = await res.json().catch(() => null);
        if (!res.ok || !data?.ok) {
          throw new Error(data?.error || 'Không thể thực hiện thao tác.');
        }
        return data;
      }

      function bindInteractiveHandlers() {
        document.getElementById('progressForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const status = document.getElementById('guestStatusSelect')?.value;
          const progress = Number(document.getElementById('guestProgressInput')?.value || 0);
          const nameVal = document.getElementById('progressGuestName')?.value.trim() || guestName || 'Khách';
          guestName = nameVal;
          localStorage.setItem('worktree_share_guest_name', guestName);
          try {
            await postGuest({ guestAction: 'update_progress', guestName, status, progress });
            setBanner('ok', 'Đã cập nhật tiến độ công việc.');
            await loadShare();
          } catch (err) {
            setBanner('error', err.message);
            renderTaskView(currentData);
          }
        });

        root.querySelectorAll('input[data-checklist-id]').forEach(cb => {
          cb.addEventListener('change', async () => {
            const itemId = cb.dataset.checklistId;
            const isDone = cb.checked;
            try {
              await postGuest({ guestAction: 'toggle_checklist', guestName: guestName || 'Khách', itemId, isDone });
              setBanner('ok', 'Đã cập nhật checklist.');
              await loadShare();
            } catch (err) {
              setBanner('error', err.message);
              await loadShare();
            }
          });
        });

        document.getElementById('addChecklistForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const input = document.getElementById('newChecklistInput');
          const content = input?.value.trim() || '';
          if (!content) return;
          try {
            await postGuest({ guestAction: 'add_checklist', guestName: guestName || 'Khách', content });
            setBanner('ok', 'Đã thêm mục checklist.');
            await loadShare();
          } catch (err) {
            setBanner('error', err.message);
            renderTaskView(currentData);
          }
        });

        document.getElementById('commentForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const gName = document.getElementById('guestNameInput')?.value.trim() || '';
          const body = document.getElementById('guestCommentInput')?.value.trim() || '';
          if (!gName || !body) return;
          guestName = gName;
          localStorage.setItem('worktree_share_guest_name', guestName);
          try {
            await postGuest({ guestAction: 'add_comment', guestName: gName, body });
            setBanner('ok', 'Đã gửi phản hồi.');
            await loadShare();
          } catch (err) {
            setBanner('error', err.message);
            renderTaskView(currentData);
          }
        });
      }

      async function loadShare(fromPinSubmit = false) {
        if (!token) {
          renderNotFound('Thiếu mã liên kết chia sẻ.');
          return;
        }
        try {
          const res = await fetch(`/api/share?token=${encodeURIComponent(token)}`, {
            method: unlockedPin ? 'POST' : 'GET',
            headers: {
              'Content-Type': 'application/json',
              ...(unlockedPin ? { 'X-Share-Pin': unlockedPin } : {})
            },
            ...(unlockedPin ? { body: JSON.stringify({ token, guestAction: 'unlock', pin: unlockedPin }) } : {})
          });
          const data = await res.json().catch(() => null);
          if (res.status === 404 || !data) {
            renderNotFound();
            return;
          }
          if (res.status === 403 && data.requiresPin) {
            sessionStorage.removeItem(`wt_share_pin:${token}`);
            unlockedPin = '';
            renderPinGate(currentData?.share || { label: 'Công việc chia sẻ' }, fromPinSubmit ? (data.error || 'Mã PIN không đúng.') : '');
            return;
          }
          if (data.requiresPin) {
            currentData = data;
            renderPinGate(data.share || {});
            return;
          }
          if (!res.ok || !data.ok) {
            renderNotFound(data.error);
            return;
          }
          renderTaskView(data);
        } catch {
          renderNotFound('Không thể kết nối máy chủ WorkTree X.');
        }
      }

      loadShare();
    })();
  </script>
</body>
</html>
