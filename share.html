<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Công việc được chia sẻ · WorkTree X</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/src/design-system/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .share-shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
    }
    .share-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
    }
    .share-header-inner {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--brand-mark-bg);
      color: var(--brand-mark-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 700;
      font-size: 15px;
    }
    .brand-meta {
      min-width: 0;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-3);
      color: var(--text);
    }
    .badge.primary { background: var(--primary-soft); color: var(--primary-text); }
    .badge.green { background: var(--green-soft); color: var(--green); }
    .badge.amber { background: var(--amber-soft); color: var(--amber); }
    .badge.red { background: var(--red-soft); color: var(--red); }
    .badge.blue { background: var(--blue-soft); color: var(--blue); }
    .btn {
      min-height: 36px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background .15s ease, border-color .15s ease;
    }
    .btn:hover:not(:disabled) { background: var(--surface-3); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn.primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .share-main {
      width: 100%;
      max-width: 880px;
      margin: 24px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .panel-title {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .task-heading {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 14px;
      word-break: break-word;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      padding: 14px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
    }
    .meta-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .meta-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .meta-value {
      font-size: 13px;
      font-weight: 600;
    }
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-bar {
      flex: 1;
      height: 8px;
      border-radius: var(--radius-pill);
      background: var(--surface-3);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: var(--radius-pill);
      transition: width .2s ease;
    }
    .progress-fill.done { background: var(--green); }
    .description-box {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      color: var(--text);
      margin: 0;
    }
    .muted { color: var(--muted); font-size: 13px; }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .tag-chip {
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: var(--surface-3);
      font-size: 12px;
      color: var(--text);
    }
    .checklist-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .checklist-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .checklist-item.is-done span {
      text-decoration: line-through;
      color: var(--muted);
    }
    .inline-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      padding: 9px 12px;
      font-size: 14px;
    }
    .inline-form .input { flex: 1; min-width: 180px; }
    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .comment-item {
      padding: 12px;
      border-radius: var(--radius-lg);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .comment-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .comment-body {
      margin: 0;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .compose-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .error-banner {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--red-soft);
      color: var(--red);
      font-size: 13px;
      font-weight: 500;
    }
    .ok-banner {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--green-soft);
      color: var(--green);
      font-size: 13px;
      font-weight: 500;
    }
    .center-state {
      max-width: 480px;
      margin: 48px auto;
      text-align: center;
      padding: 28px 22px;
    }
    .pin-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      text-align: left;
    }
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .attachment-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .attachment-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: var(--radius-md);
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 12px;
    }
    @media (max-width: 900px) {
      .btn, .select, .input { min-height: 44px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="share-shell">
    <header class="share-header">
      <div class="share-header-inner">
        <div class="brand-group">
          <div class="brand-mark" aria-hidden="true">W</div>
          <div class="brand-meta">
            <h1 class="brand-title">
              <span>WorkTree X</span>
              <span class="badge" id="orgBadge">Đang tải...</span>
            </h1>
            <p class="brand-sub" id="shareSubtitle">Trang chia sẻ công việc an toàn</p>
          </div>
        </div>
        <div class="header-actions">
          <span class="badge primary" id="permBadge" hidden></span>
          <button type="button" class="btn" id="themeBtn" aria-label="Chuyển giao diện sáng tối">
            <svg class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <span>Giao diện</span>
          </button>
        </div>
      </div>
    </header>

    <main class="share-main" id="shareRoot">
      <div class="panel center-state">
        <p class="muted">Đang tải dữ liệu công việc được chia sẻ...</p>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const root = document.getElementById('shareRoot');
      const orgBadge = document.getElementById('orgBadge');
      const permBadge = document.getElementById('permBadge');
      const shareSubtitle = document.getElementById('shareSubtitle');
      const themeBtn = document.getElementById('themeBtn');

      const STATUS_LABEL = {
        todo: 'Chưa làm',
        in_progress: 'Đang làm',
        review: 'Chờ duyệt',
        done: 'Hoàn thành'
      };
      const PRIORITY_LABEL = {
        urgent: 'Khẩn cấp',
        high: 'Cao',
        medium: 'Trung bình',
        low: 'Thấp'
      };
      const PERMISSION_LABEL = {
        view: 'Chỉ xem',
        comment: 'Xem & Phản hồi',
        edit_progress: 'Cập nhật tiến độ (Không Xóa)'
      };

      function esc(v) {
        return String(v == null ? '' : v)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getTokenFromUrl() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('token')) return params.get('token').trim();
        const parts = window.location.pathname.split('/').filter(Boolean);
        if (parts[0] === 's' && parts[1]) return decodeURIComponent(parts[1]).trim();
        return '';
      }

      const token = getTokenFromUrl();
      let unlockedPin = token ? (sessionStorage.getItem(`wt_share_pin:${token}`) || '') : '';
      let guestName = localStorage.getItem('worktree_share_guest_name') || '';
      let currentData = null;
      let statusBanner = '';

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        localStorage.setItem('worktree_share_theme', document.documentElement.dataset.theme);
      }
      applyTheme(localStorage.getItem('worktree_share_theme') || 'light');
      themeBtn.addEventListener('click', () => {
        applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      });

      function formatSize(bytes) {
        const b = Number(bytes || 0);
        if (b < 1024) return `${b} B`;
        if (b < 1024 * 1024) return `${(b / 1024).toFixed(1)} KB`;
        return `${(b / (1024 * 1024)).toFixed(1)} MB`;
      }

      function formatTime(iso) {
        if (!iso) return 'Không giới hạn';
        try {
          return new Date(iso).toLocaleString('vi-VN');
        } catch {
          return iso;
        }
      }

      function renderNotFound(msg) {
        orgBadge.textContent = 'Không khả dụng';
        permBadge.hidden = true;
        shareSubtitle.textContent = 'Liên kết hết hạn hoặc đã thu hồi';
        root.innerHTML = `
          <div class="panel center-state" role="alert">
            <h2 style="margin:0 0 8px;font-size:18px;">Liên kết không tồn tại hoặc đã bị khóa</h2>
            <p class="muted" style="margin:0 0 16px;">${esc(msg || 'Liên kết chia sẻ này có thể đã hết hạn, bị thu hồi bởi quản trị viên, hoặc đường dẫn không đúng.')}</p>
            <button type="button" class="btn" id="retryLoadBtn">Thử tải lại</button>
          </div>
        `;
        document.getElementById('retryLoadBtn')?.addEventListener('click', loadShare);
      }

      function renderPinGate(share, errorText = '') {
        orgBadge.textContent = share.organizationName || 'WorkTree X';
        permBadge.hidden = false;
        permBadge.textContent = PERMISSION_LABEL[share.permission] || share.permission;
        shareSubtitle.textContent = 'Liên kết được bảo vệ bằng mã PIN';
        root.innerHTML = `
          <div class="panel center-state">
            <h2 style="margin:0 0 8px;font-size:18px;">Nhập mã PIN để xem công việc</h2>
            <p class="muted" style="margin:0;">${esc(share.label || 'Tài liệu công việc chia sẻ ngoài')}</p>
            <form class="pin-form" id="pinForm">
              ${errorText ? `<div class="error-banner" role="alert">${esc(errorText)}</div>` : ''}
              <input class="input" id="pinInput" type="password" inputmode="numeric" autocomplete="off" required maxlength="12" placeholder="Nhập mã PIN...">
              <button class="btn primary" type="submit">Mở công việc</button>
            </form>
          </div>
        `;
        document.getElementById('pinForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const val = document.getElementById('pinInput')?.value.trim() || '';
          if (!val) return;
          unlockedPin = val;
          sessionStorage.setItem(`wt_share_pin:${token}`, val);
          await loadShare(true);
        });
      }

      function renderTaskView(data) {
        currentData = data;
        const { share, task, checklist = [], comments = [], attachments = [] } = data;
        const canComment = share.permission === 'comment' || share.permission === 'edit_progress';
        const canChecklist = Boolean(share.allowChecklistToggle);
        const canEditProgress = share.permission === 'edit_progress';

        orgBadge.textContent = share.organizationName || 'WorkTree X';
        permBadge.hidden = false;
        permBadge.textContent = PERMISSION_LABEL[share.permission] || share.permission;
        shareSubtitle.textContent = share.expiresAt
          ? `Hết hạn: ${formatTime(share.expiresAt)}`
          : 'Liên kết đang hoạt động · Ẩn thông tin nội bộ';

        const statusBadgeClass = task.status === 'done'
          ? 'green'
          : (task.status === 'review' ? 'amber' : (task.status === 'in_progress' ? 'blue' : ''));

        root.innerHTML = `
          ${statusBanner ? `<div class="${statusBanner.type === 'error' ? 'error-banner' : 'ok-banner'}" role="status">${esc(statusBanner.text)}</div>` : ''}
          <section class="panel">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
              <span class="badge ${statusBadgeClass}">${esc(STATUS_LABEL[task.status] || task.status)}</span>
              <span class="muted">Cập nhật: ${esc(formatTime(task.updatedAt))}</span>
            </div>
            <h2 class="task-heading">${esc(task.title)}</h2>
            <div class="meta-grid">
              <div class="meta-cell">
                <span class="meta-label">Ưu tiên</span>
                <span class="meta-value">${esc(PRIORITY_LABEL[task.priority] || task.priority)}</span>
              </div>
              <div class="meta-cell">
                <span class="meta-label">Phụ trách</span>
                <span class="meta-value">${esc(task.primaryAssigneeName || 'Chưa phân công')}</span>
              </div>
              <div class="meta-cell">
                <span class="meta-label">Thời hạn</span>
                <span class="meta-value">${esc(task.dueDate || 'Chưa đặt hạn')}</span>
              </div>
              <div class="meta-cell">
                <span class="meta-label">Tiến độ</span>
                <div class="progress-wrap">
                  <div class="progress-bar"><div class="progress-fill ${task.progress >= 100 ? 'done' : ''}" style="width:${Math.min(100, Math.max(0, Number(task.progress || 0)))}%"></div></div>
                  <span class="meta-value">${Number(task.progress || 0)}%</span>
                </div>
              </div>
            </div>
            ${task.tags && task.tags.length ? `<div class="tag-row">${task.tags.map(tg => `<span class="tag-chip">#${esc(tg)}</span>`).join('')}</div>` : ''}
            ${canEditProgress ? `
              <form class="controls-row" id="progressForm">
                <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;">
                  <span>Trạng thái:</span>
                  <select class="select" id="guestStatusSelect" style="width:auto;">
                    ${Object.entries(STATUS_LABEL).map(([k, lbl]) => `<option value="${k}" ${task.status === k ? 'selected' : ''}>${esc(lbl)}</option>`).join('')}
                  </select>
                </label>
                <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;">
                  <span>Tiến độ (%):</span>
                  <input class="input" id="guestProgressInput" type="number" min="0" max="100" value="${Number(task.progress || 0)}" style="width:90px;">
                </label>
                <input class="input" id="progressGuestName" maxlength="80" placeholder="Tên của bạn (để ghi nhật ký)" value="${esc(guestName)}" style="width:200px;">
                <button class="btn primary" type="submit">Cập nhật tiến độ</button>
              </form>
            ` : ''}
          </section>

          <section class="panel">
            <h3 class="panel-title">Mô tả công việc</h3>
            <p class="description-box">${task.description ? esc(task.description) : '<span class="muted">Chưa có mô tả chi tiết.</span>'}</p>
          </section>

          <section class="panel">
            <h3 class="panel-title">
              <span>Checklist</span>
              <span class="muted">${Number(task.checklistDone || 0)} / ${Number(task.checklistTotal || 0)} hoàn thành</span>
            </h3>
            ${checklist.length ? `
              <ul class="checklist-list">
                ${checklist.map(item => `
                  <li class="checklist-item ${item.isDone ? 'is-done' : ''}">
                    <input type="checkbox" data-checklist-id="${esc(item.id)}" ${item.isDone ? 'checked' : ''} ${canChecklist ? '' : 'disabled'} aria-label="${esc(item.content)}">
                    <span>${esc(item.content)}</span>
                  </li>
                `).join('')}
              </ul>
            ` : '<p class="muted" style="margin:0;">Chưa có mục checklist.</p>'}
            ${canChecklist ? `
              <form class="inline-form" id="addChecklistForm">
                <input class="input" id="newChecklistInput" maxlength="400" required placeholder="Thêm bước kiểm tra mới...">
                <button class="btn" type="submit">Thêm mục</button>
              </form>
            ` : ''}
          </section>

          ${attachments.length ? `
            <section class="panel">
              <h3 class="panel-title">Tệp đính kèm (${attachments.length})</h3>
              <div class="attachment-list">
                ${attachments.map(a => `<span class="attachment-pill">${esc(a.originalName)} <span class="muted">(${esc(formatSize(a.sizeBytes))})</span></span>`).join('')}
              </div>
              <p class="muted" style="margin:8px 0 0;font-size:12px;">Vì lý do bảo mật, tệp đính kèm nội bộ được bảo vệ và không tải trực tiếp từ liên kết công khai.</p>
            </section>
          ` : ''}

          <section class="panel">
            <h3 class="panel-title">
              <span>Trao đổi (${comments.length})</span>
              ${share.hideInternalComments ? '<span class="badge">Đã ẩn ghi chú nội bộ</span>' : ''}
            </h3>
            <div class="comment-list">
              ${comments.length ? comments.map(c => `
                <article class="comment-item">
                  <div class="comment-head">
                    <strong>${esc(c.authorName)}</strong>
                    <span class="muted">${esc(formatTime(c.createdAt))}</span>
                  </div>
                  <p class="comment-body">${esc(c.body)}</p>
                </article>
              `).join('') : '<p class="muted" style="margin:0;">Chưa có trao đổi công khai nào.</p>'}
            </div>
            ${canComment ? `
              <form class="compose-grid" id="commentForm">
                <input class="input" id="guestNameInput" required maxlength="80" placeholder="Tên hoặc tên công ty của bạn *" value="${esc(guestName)}">
                <textarea class="textarea" id="guestCommentInput" required maxlength="5000" rows="3" placeholder="Nhập phản hồi, góp ý hoặc xác nhận nghiệm thu..."></textarea>
                <div style="display:flex;justify-content:flex-end;">
                  <button class="btn primary" type="submit">Gửi phản hồi</button>
                </div>
              </form>
            ` : '<p class="muted" style="margin:0;">Liên kết này chỉ ở chế độ xem.</p>'}
          </section>
        `;

        bindInteractiveHandlers();
      }

      function setBanner(type, text) {
        statusBanner = { type, text };
      }

      async function postGuest(payload) {
        const res = await fetch(`/api/share?token=${encodeURIComponent(token)}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(unlockedPin ? { 'X-Share-Pin': unlockedPin } : {})
          },
          body: JSON.stringify({ token, pin: unlockedPin || undefined, ...payload })
        });
        const data = await res.json().catch(() => null);
        if (!res.ok || !data?.ok) {
          throw new Error(data?.error || 'Không thể thực hiện thao tác.');
        }
        return data;
      }

      function bindInteractiveHandlers() {
        document.getElementById('progressForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const status = document.getElementById('guestStatusSelect')?.value;
          const progress = Number(document.getElementById('guestProgressInput')?.value || 0);
          const nameVal = document.getElementById('progressGuestName')?.value.trim() || guestName || 'Khách';
          guestName = nameVal;
          localStorage.setItem('worktree_share_guest_name', guestName);
          try {
            await postGuest({ guestAction: 'update_progress', guestName, status, progress });
            setBanner('ok', 'Đã cập nhật tiến độ công việc.');
            await loadShare();
          } catch (err) {
            setBanner('error', err.message);
            renderTaskView(currentData);
          }
        });

        root.querySelectorAll('input[data-checklist-id]').forEach(cb => {
          cb.addEventListener('change', async () => {
            const itemId = cb.dataset.checklistId;
            const isDone = cb.checked;
            try {
              await postGuest({ guestAction: 'toggle_checklist', guestName: guestName || 'Khách', itemId, isDone });
              setBanner('ok', 'Đã cập nhật checklist.');
              await loadShare();
            } catch (err) {
              setBanner('error', err.message);
              await loadShare();
            }
          });
        });

        document.getElementById('addChecklistForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const input = document.getElementById('newChecklistInput');
          const content = input?.value.trim() || '';
          if (!content) return;
          try {
            await postGuest({ guestAction: 'add_checklist', guestName: guestName || 'Khách', content });
            setBanner('ok', 'Đã thêm mục checklist.');
            await loadShare();
          } catch (err) {
            setBanner('error', err.message);
            renderTaskView(currentData);
          }
        });

        document.getElementById('commentForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const gName = document.getElementById('guestNameInput')?.value.trim() || '';
          const body = document.getElementById('guestCommentInput')?.value.trim() || '';
          if (!gName || !body) return;
          guestName = gName;
          localStorage.setItem('worktree_share_guest_name', guestName);
          try {
            await postGuest({ guestAction: 'add_comment', guestName: gName, body });
            setBanner('ok', 'Đã gửi phản hồi.');
            await loadShare();
          } catch (err) {
            setBanner('error', err.message);
            renderTaskView(currentData);
          }
        });
      }

      async function loadShare(fromPinSubmit = false) {
        if (!token) {
          renderNotFound('Thiếu mã liên kết chia sẻ.');
          return;
        }
        try {
          const res = await fetch(`/api/share?token=${encodeURIComponent(token)}`, {
            method: unlockedPin ? 'POST' : 'GET',
            headers: {
              'Content-Type': 'application/json',
              ...(unlockedPin ? { 'X-Share-Pin': unlockedPin } : {})
            },
            ...(unlockedPin ? { body: JSON.stringify({ token, guestAction: 'unlock', pin: unlockedPin }) } : {})
          });
          const data = await res.json().catch(() => null);
          if (res.status === 404 || !data) {
            renderNotFound();
            return;
          }
          if (res.status === 403 && data.requiresPin) {
            sessionStorage.removeItem(`wt_share_pin:${token}`);
            unlockedPin = '';
            renderPinGate(currentData?.share || { label: 'Công việc chia sẻ' }, fromPinSubmit ? (data.error || 'Mã PIN không đúng.') : '');
            return;
          }
          if (data.requiresPin) {
            currentData = data;
            renderPinGate(data.share || {});
            return;
          }
          if (!res.ok || !data.ok) {
            renderNotFound(data.error);
            return;
          }
          renderTaskView(data);
        } catch {
          renderNotFound('Không thể kết nối máy chủ WorkTree X.');
        }
      }

      loadShare();
    })();
  </script>
</body>
</html>
