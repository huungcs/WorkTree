<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Công việc được chia sẻ · WorkTree X</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/src/design-system/tokens.css">
  <link rel="stylesheet" href="/src/design-system/typography.css?v=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .share-shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
    }
    .share-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
    }
    .share-header-inner {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--brand-mark-bg);
      color: var(--brand-mark-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-mark svg { width: 24px; height: 24px; }
    .brand-meta {
      min-width: 0;
    }
    .brand-title {
      font-size: var(--text-mobile-base);
      font-weight: var(--weight-brand);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 4px 8px;
      flex-wrap: wrap;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .theme-toggle { padding: 0; width: 36px; flex: none; color: var(--muted); }
    .theme-sun, html[data-theme="dark"] .theme-moon { display: none; }
    html[data-theme="dark"] .theme-sun { display: block; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-badge);
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-3);
      color: var(--text);
    }
    .badge.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
    .task-permission { display: none; }
    .badge.primary { background: var(--primary-soft); color: var(--primary-text); }
    .badge.green { background: var(--green-soft); color: var(--green); }
    .badge.amber { background: var(--amber-soft); color: var(--amber); }
    .badge.red { background: var(--red-soft); color: var(--red); }
    .badge.blue { background: var(--blue-soft); color: var(--blue); }
    .btn {
      min-height: 36px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background .15s ease, border-color .15s ease;
    }
    .btn:hover:not(:disabled, [aria-disabled="true"]) { background: var(--surface-3); }
    .btn:disabled, .btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn.primary:hover:not(:disabled, [aria-disabled="true"]) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .share-main {
      width: 100%;
      max-width: 880px;
      margin: 20px auto 0;
      min-width: 0;
      padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      padding: 20px;
      box-shadow: var(--shadow);
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .task-panel { padding: 24px; }
    .task-top { display: flex; align-items: center; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
    .task-heading + .task-top { margin-top: 10px; }
    .panel-title {
      font-size: var(--text-md);
      font-weight: var(--weight-strong);
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .section-meta { font-weight: var(--weight-medium); }
    .task-heading {
      font-size: var(--text-page-title);
      font-weight: var(--weight-strong);
      letter-spacing: var(--tracking-title);
      line-height: var(--leading-title);
      margin: 0;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 12px 14px;
      margin: 16px 0 0;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
    }
    .meta-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .meta-label {
      font-size: var(--text-label);
      font-weight: 600;
      color: var(--muted);
    }
    .meta-value {
      margin: 0;
      font-size: var(--text-control);
      font-weight: 600;
    }
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-bar {
      flex: 1;
      height: 5px;
      border-radius: var(--radius-pill);
      background: var(--surface-3);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: var(--radius-pill);
      transition: width .2s ease;
    }
    .progress-fill.done { background: var(--green); }
    .description-box {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: var(--text-mobile-base);
      color: var(--text);
      margin: 0;
    }
    .muted { color: var(--muted); font-size: var(--text-label); }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .tag-chip {
      padding: 3px 9px;
      border-radius: var(--radius-badge);
      background: var(--surface-3);
      font-size: 12px;
      color: var(--muted);
    }
    .checklist-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .checklist-item {
      display: flex;
      font-size: var(--text-control);
      border-top: 1px solid var(--line);
    }
    .checklist-item > label, .checklist-item > .checklist-static {
      display: flex; align-items: center; gap: 10px; min-width: 0; width: 100%; min-height: 42px; padding: 8px 0;
    }
    .checklist-item > label { cursor: pointer; }
    .checklist-mark { display: grid; place-items: center; flex: none; width: 18px; height: 18px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--primary-text); }
    .is-done .checklist-mark { background: var(--primary-soft); border-color: var(--primary-soft); }
    .checklist-mark .icon { width: 13px; height: 13px; }
    .checklist-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      flex: none;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .checklist-item.is-done .checklist-text {
      text-decoration: line-through;
      color: var(--muted);
    }
    .inline-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      padding: 9px 12px;
      font-size: var(--text-entry);
    }
    .inline-form .input { flex: 1; min-width: 180px; }
    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .comment-item {
      padding: 12px;
      border-radius: var(--radius-lg);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .comment-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .comment-body {
      margin: 0;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .compose-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface-2);
    }
    .compose-grid .textarea { resize: vertical; }
    .error-banner {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--red-soft);
      color: var(--red);
      font-size: 13px;
      font-weight: 500;
    }
    .ok-banner {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--green-soft);
      color: var(--green);
      font-size: 13px;
      font-weight: 500;
    }
    .share-feedback { margin-top: 10px; }
    .share-feedback:empty { margin: 0; }
    .share-feedback .btn { margin-top: 8px; }
    .center-state {
      width: min(100%, 480px);
      margin: 48px auto;
      text-align: center;
      padding: 28px 22px;
    }
    .center-state .panel-title { justify-content: center; }
    .pin-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      text-align: left;
    }
    .controls-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: end;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .form-field { display: grid; gap: 4px; min-width: 0; font-size: var(--text-label); font-weight: var(--weight-semibold); }
    .form-actions { display: flex; justify-content: flex-end; }
    .attachment-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .attachment-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: var(--radius-md);
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 12px;
    }
    @media (max-width: 900px) {
      .btn, .select, .input { min-height: 44px; }
      .theme-toggle { width: 44px; }
      .panel { padding: 16px; }
      .checklist-item > label { min-height: 44px; }
    }
    @media (max-width: 620px) {
      .share-header { position: static; }
      .share-header-inner { gap: 8px; }
      .brand-group { flex: 1; }
      .brand-meta { min-width: 0; flex: 1; }
      .brand-title { flex-wrap: nowrap; }
      .brand-title > span:first-child { flex: none; }
      .brand-title #orgBadge {
        display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        padding: 2px 7px; font-size: var(--text-sm);
      }
      .brand-sub { margin-top: 3px; line-height: 1.35; overflow-wrap: anywhere; }
      body:has(.task-panel) #permBadge { display: none; }
      .share-main { margin-top: 12px; gap: 12px; }
      .task-panel { padding: 18px 16px 16px; }
      .task-top { justify-content: flex-start; gap: 5px 7px; }
      .task-top time { margin-inline-start: auto; }
      .task-top .task-permission { display: inline-flex; max-width: 100%; }
      .task-top .badge { padding: 3px 8px; }
      .meta-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0; margin-top: 14px; padding: 0;
      }
      .meta-cell { padding: 10px 12px; }
      .meta-cell:nth-child(even) { border-inline-start: 1px solid var(--line); }
      .meta-cell:nth-child(n+3) { border-top: 1px solid var(--line); }
      .meta-value { line-height: 1.4; }
      .description-box { line-height: 1.65; }
      .checklist-item > .checklist-static { min-height: 44px; }
      .checklist-item.is-done .checklist-static .checklist-text {
        text-decoration: none;
        color: var(--text);
      }
      .controls-row { grid-template-columns: minmax(0, 1fr); }
      .comment-head { flex-wrap: wrap; }
      .comment-list { margin-bottom: 0; }
      .comment-list + .compose-grid { margin-top: 14px; }
      .attachment-pill { min-width: 0; max-width: 100%; }
      .attachment-pill > .muted { flex: none; white-space: nowrap; }
      .panel-title > .discussion-scope {
        padding: 0; background: transparent; color: var(--muted);
        font-weight: var(--weight-medium);
      }
    }
    @media (max-width: 380px) {
      .header-actions { gap: 4px; }
      .share-header-inner #permBadge { max-width: 95px; }
      .task-top time { font-size: var(--text-sm); }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn, .progress-fill { transition: none; }
    }
  </style>
  <link rel="stylesheet" href="/src/design-system/field-focus.css?v=1">
</head>
<body>
  <div class="share-shell">
    <header class="share-header">
      <div class="share-header-inner">
        <div class="brand-group">
          <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M7 8v9a6 6 0 006 6h12M16 5v18M25 10v13" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="7" cy="7" r="3" fill="currentColor"/><circle cx="16" cy="6" r="3" fill="currentColor"/><circle cx="25" cy="10" r="3" fill="currentColor"/></svg></div>
          <div class="brand-meta">
            <p class="brand-title">
              <span>WorkTree X</span>
              <span class="badge" id="orgBadge">Đang tải...</span>
            </p>
            <p class="brand-sub" id="shareSubtitle">Công việc được chia sẻ</p>
          </div>
        </div>
        <div class="header-actions">
          <span class="badge primary" id="permBadge" hidden></span>
          <button type="button" class="btn theme-toggle" id="themeBtn" aria-label="Chuyển giao diện sáng tối">
            <svg class="icon theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="share-main" id="shareRoot">
      <div class="panel center-state">
        <p class="muted">Đang tải dữ liệu công việc được chia sẻ...</p>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const root = document.getElementById('shareRoot');
      const orgBadge = document.getElementById('orgBadge');
      const permBadge = document.getElementById('permBadge');
      const shareSubtitle = document.getElementById('shareSubtitle');
      const themeBtn = document.getElementById('themeBtn');

      const STATUS_LABEL = {
        todo: 'Chưa làm',
        in_progress: 'Đang làm',
        review: 'Chờ duyệt',
        done: 'Hoàn thành'
      };
      const PRIORITY_LABEL = {
        urgent: 'Khẩn cấp',
        high: 'Cao',
        medium: 'Trung bình',
        low: 'Thấp'
      };
      const PERMISSION_LABEL = {
        view: 'Chỉ xem',
        comment: 'Xem và phản hồi',
        edit_progress: 'Cập nhật tiến độ'
      };

      function esc(v) {
        return String(v == null ? '' : v)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getTokenFromUrl() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('token')) return params.get('token').trim();
        const parts = window.location.pathname.split('/').filter(Boolean);
        if (parts[0] === 's' && parts[1]) return decodeURIComponent(parts[1]).trim();
        return '';
      }

      const urlParams = new URLSearchParams(window.location.search);
      const demoShareToken = (!urlParams.get('token') && urlParams.get('demo_share')) ? urlParams.get('demo_share').trim() : '';
      const token = getTokenFromUrl();
      const pinStoreKey = demoShareToken ? `wt_demo_share_pin:${demoShareToken}` : `wt_share_pin:${token}`;
      let unlockedPin = (demoShareToken || token) ? (sessionStorage.getItem(pinStoreKey) || '') : '';
      let guestName = localStorage.getItem('worktree_share_guest_name') || '';
      let currentData = null;

      const DEMO_STATUS_TO_API = { 'Chưa làm': 'todo', 'Đang làm': 'in_progress', 'Chờ duyệt': 'review', 'Hoàn thành': 'done' };
      const DEMO_API_TO_STATUS = { todo: 'Chưa làm', in_progress: 'Đang làm', review: 'Chờ duyệt', done: 'Hoàn thành' };
      const DEMO_PRIO_TO_API = { 'Khẩn cấp': 'urgent', 'Cao': 'high', 'Trung bình': 'medium', 'Thấp': 'low' };

      function readDemoShareState() {
        if (!demoShareToken) return null;
        try {
          if (localStorage.getItem('worktree_x_v8_demo_share_policy') === 'false') return null;
          const sharesRaw = JSON.parse(localStorage.getItem('worktree_x_v8_demo_shares') || '{}');
          let matched = null;
          for (const list of Object.values(sharesRaw || {})) {
            if (!Array.isArray(list)) continue;
            const found = list.find(l => l.token === demoShareToken);
            if (found) { matched = found; break; }
          }
          if (!matched || matched.revokedAt || !matched.isActive) return null;
          if (matched.expiresAt && new Date(matched.expiresAt).getTime() <= Date.now()) return null;
          const dataPack = JSON.parse(localStorage.getItem('worktree_x_v8_demo_data') || 'null');
          const tasks = dataPack?.data?.tasks || [];
          const nodes = dataPack?.data?.nodes || [];
          const t = tasks.find(x => String(x.id) === String(matched.taskId));
          if (!t) return null;
          const nodeName = id => nodes.find(n => String(n.id) === String(id))?.name || '';
          const orgName = nodes.find(n => n.parent === null)?.name || 'NTH GROUP (Demo)';
          const checklist = (t.checklist || []).map((c, idx) => ({ id: String(idx), content: Array.isArray(c) ? c[0] : (c.text || ''), isDone: Boolean(Array.isArray(c) ? c[1] : c.done) }));
          const comments = (t.comments || []).map((c, idx) => ({ id: String(c.id || idx), authorName: c.author || 'Thành viên', body: c.text || '', createdAt: c.at || t.updatedAt || '' }));
          return {
            matched, dataPack, tasks, t,
            payload: {
              ok: true,
              share: {
                organizationName: orgName,
                permission: matched.permission || 'view',
                allowChecklistToggle: Boolean(matched.allowChecklistToggle),
                hideInternalComments: Boolean(matched.hideInternalComments),
                label: matched.label || 'Công việc Demo'
              },
              task: {
                id: t.id,
                title: t.title,
                description: t.desc || '',
                status: DEMO_STATUS_TO_API[t.status] || 'todo',
                priority: DEMO_PRIO_TO_API[t.priority] || 'medium',
                progress: Number(t.progress) || 0,
                dueDate: t.due || '',
                nodeName: nodeName(t.node),
                assigneeName: t.owner ? nodeName(t.owner) : '',
                tags: t.tags || [],
                checklistTotal: checklist.length,
                checklistDone: checklist.filter(i => i.isDone).length
              },
              checklist,
              attachments: [],
              comments
            }
          };
        } catch (_) {
          return null;
        }
      }
      let isSaving = false;
      const draftFields = ['guestNameInput', 'guestCommentInput', 'newChecklistInput', 'guestStatusSelect', 'guestProgressInput', 'progressGuestName'];

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        localStorage.setItem('worktree_share_theme', document.documentElement.dataset.theme);
        const label = theme === 'dark' ? 'Bật giao diện sáng' : 'Bật giao diện tối';
        themeBtn.setAttribute('aria-label', label);
        themeBtn.title = label;
      }
      applyTheme(localStorage.getItem('worktree_share_theme') || 'light');
      themeBtn.addEventListener('click', () => {
        applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      });

      function formatSize(bytes) {
        const b = Number(bytes || 0);
        if (b < 1024) return `${b} B`;
        if (b < 1024 * 1024) return `${(b / 1024).toFixed(1)} KB`;
        return `${(b / (1024 * 1024)).toFixed(1)} MB`;
      }

      function formatTime(iso) {
        if (!iso) return '';
        const date = new Date(iso);
        return Number.isNaN(date.getTime()) ? '' : new Intl.DateTimeFormat('vi-VN', { dateStyle: 'short', timeStyle: 'short' }).format(date);
      }

      function formatDueDate(value) {
        const parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || '');
        return parts ? `${parts[3]}/${parts[2]}/${parts[1]}` : value || 'Chưa đặt hạn';
      }

      function renderNotFound(msg, connectionError = false) {
        orgBadge.textContent = 'Không khả dụng';
        permBadge.hidden = true;
        shareSubtitle.textContent = connectionError ? 'Lỗi kết nối' : 'Công việc được chia sẻ';
        root.innerHTML = `
          <div class="panel center-state" role="alert">
            <h1 class="panel-title">${connectionError ? 'Chưa tải được công việc' : 'Liên kết không khả dụng'}</h1>
            <p class="muted" style="margin:0 0 16px;">${esc(msg || 'Liên kết chia sẻ này có thể đã hết hạn, bị thu hồi bởi quản trị viên, hoặc đường dẫn không đúng.')}</p>
            <button type="button" class="btn" id="retryLoadBtn">Thử tải lại</button>
          </div>
        `;
        document.getElementById('retryLoadBtn')?.addEventListener('click', async (event) => {
          const button = event.currentTarget;
          button.disabled = true;
          button.textContent = 'Đang tải…';
          await loadShare();
          (document.getElementById('retryLoadBtn') || root.querySelector('h1[tabindex]'))?.focus({ preventScroll: true });
        });
      }

      function renderPinGate(share, errorText = '') {
        orgBadge.textContent = share.organizationName || 'WorkTree X';
        permBadge.hidden = false;
        permBadge.textContent = PERMISSION_LABEL[share.permission] || share.permission;
        shareSubtitle.textContent = 'Liên kết được bảo vệ bằng mã PIN';
        root.innerHTML = `
          <div class="panel center-state">
            <h1 class="panel-title">Nhập mã PIN để xem công việc</h1>
            <p class="muted" style="margin:0;">${esc(share.label || 'Tài liệu công việc chia sẻ ngoài')}</p>
            <form class="pin-form" id="pinForm">
              <input class="input" id="pinInput" type="password" autocomplete="off" required maxlength="12" placeholder="Nhập mã PIN" aria-label="Mã PIN">
              <button class="btn primary" type="submit">Mở công việc</button>
            </form>
            <div id="pinFeedback" class="share-feedback" role="status" aria-atomic="true"></div>
          </div>
        `;
        const input = document.getElementById('pinInput');
        showFeedback('pinFeedback', 'error', errorText);
        if (errorText) input.focus({ preventScroll: true });
        document.getElementById('pinForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const form = e.currentTarget;
          const button = form.querySelector('button');
          const val = input.value.trim();
          if (!val || button.disabled) return;
          button.disabled = true;
          button.textContent = 'Đang mở…';
          showFeedback('pinFeedback', '', '');
          unlockedPin = val;
          const opened = await loadShare({ fromPinSubmit: true });
          if (opened) {
            sessionStorage.setItem(pinStoreKey, val);
            document.getElementById('sharedTaskTitle')?.focus({ preventScroll: true });
          } else if (form.isConnected) {
            unlockedPin = '';
            button.disabled = false;
            button.textContent = 'Mở công việc';
          }
        });
      }

      function renderTaskView(data) {
        currentData = data;
        const { share, task, checklist = [], comments = [], attachments = [] } = data;
        const canComment = share.permission === 'comment' || share.permission === 'edit_progress';
        const canChecklist = canComment && Boolean(share.allowChecklistToggle);
        const canEditProgress = share.permission === 'edit_progress';
        const progress = Math.min(100, Math.max(0, Number(task.progress) || 0));

        orgBadge.textContent = share.organizationName || 'WorkTree X';
        permBadge.hidden = false;
        permBadge.textContent = PERMISSION_LABEL[share.permission] || share.permission;
        shareSubtitle.textContent = share.expiresAt
          ? `Hết hạn ${formatTime(share.expiresAt)}`
          : 'Liên kết không giới hạn thời hạn';

        const statusBadgeClass = task.status === 'done'
          ? 'green'
          : (task.status === 'review' ? 'amber' : (task.status === 'in_progress' ? 'blue' : ''));

        root.innerHTML = `
          <section class="panel task-panel" aria-labelledby="sharedTaskTitle">
            <h1 class="task-heading" id="sharedTaskTitle" tabindex="-1">${esc(task.title)}</h1>
            <div class="task-top">
              <span class="badge status ${statusBadgeClass}">${esc(STATUS_LABEL[task.status] || task.status)}</span>
              <span class="badge primary task-permission">${esc(PERMISSION_LABEL[share.permission] || share.permission)}</span>
              ${task.updatedAt ? `<time class="muted" datetime="${esc(task.updatedAt)}">Cập nhật ${esc(formatTime(task.updatedAt))}</time>` : ''}
            </div>
            <dl class="meta-grid">
              <div class="meta-cell">
                <dt class="meta-label">Ưu tiên</dt>
                <dd class="meta-value">${esc(PRIORITY_LABEL[task.priority] || task.priority)}</dd>
              </div>
              <div class="meta-cell">
                <dt class="meta-label">Phụ trách</dt>
                <dd class="meta-value">${esc(task.primaryAssigneeName || 'Chưa phân công')}</dd>
              </div>
              <div class="meta-cell">
                <dt class="meta-label">Thời hạn</dt>
                <dd class="meta-value">${esc(formatDueDate(task.dueDate))}</dd>
              </div>
              <div class="meta-cell">
                <dt class="meta-label">Tiến độ</dt>
                <dd class="meta-value progress-wrap">
                  <div class="progress-bar" role="progressbar" aria-label="Tiến độ công việc" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><div class="progress-fill ${task.status === 'done' ? 'done' : ''}" style="width:${progress}%"></div></div>
                  <span aria-hidden="true">${progress}%</span>
                </dd>
              </div>
            </dl>
            ${task.tags && task.tags.length ? `<div class="tag-row">${task.tags.map(tg => `<span class="tag-chip">${esc(tg)}</span>`).join('')}</div>` : ''}
            ${canEditProgress ? `
              <form class="controls-row" id="progressForm">
                <label class="form-field">
                  <span>Trạng thái</span>
                  <select class="select" id="guestStatusSelect">
                    ${Object.entries(STATUS_LABEL).map(([k, lbl]) => `<option value="${k}" ${task.status === k ? 'selected' : ''}>${esc(lbl)}</option>`).join('')}
                  </select>
                </label>
                <label class="form-field">
                  <span>Tiến độ (%)</span>
                  <input class="input" id="guestProgressInput" type="number" min="0" max="100" required value="${progress}">
                </label>
                <label class="form-field">Tên của bạn <input class="input" id="progressGuestName" maxlength="80" value="${esc(guestName)}"></label>
                <div class="form-actions"><button class="btn primary" type="submit">Cập nhật tiến độ</button></div>
              </form>
              <div id="progressFeedback" class="share-feedback" role="status" aria-atomic="true"></div>
            ` : ''}
          </section>

          <section class="panel">
            <h2 class="panel-title">Mô tả công việc</h2>
            <p class="description-box">${task.description ? esc(task.description) : '<span class="muted">Chưa có mô tả chi tiết.</span>'}</p>
          </section>

          <section class="panel">
            <h2 class="panel-title">
              <span>Checklist</span>
              <span class="muted section-meta">${Number(task.checklistDone || 0)}/${Number(task.checklistTotal || 0)} đã xong</span>
            </h2>
            ${checklist.length ? `
              <ul class="checklist-list">
                ${checklist.map(item => `
                  <li class="checklist-item ${item.isDone ? 'is-done' : ''}">
                    ${canChecklist ? `<label><input type="checkbox" data-checklist-id="${esc(item.id)}" ${item.isDone ? 'checked' : ''}>
                      <span class="checklist-text">${esc(item.content)}</span></label>` : `
                      <div class="checklist-static">
                        <span class="checklist-mark" role="img" aria-label="${item.isDone ? 'Đã xong' : 'Chưa xong'}">${item.isDone ? '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>' : ''}</span>
                        <span class="checklist-text">${esc(item.content)}</span>
                      </div>`}
                  </li>
                `).join('')}
              </ul>
            ` : '<p class="muted" style="margin:0;">Chưa có mục checklist.</p>'}
            ${canChecklist ? `
              <form class="inline-form" id="addChecklistForm">
                <input class="input" id="newChecklistInput" maxlength="400" required placeholder="Thêm một bước" aria-label="Nội dung mục checklist">
                <button class="btn" type="submit">Thêm mục</button>
              </form>
              <div id="checklistFeedback" class="share-feedback" role="status" aria-atomic="true"></div>
            ` : ''}
          </section>

          ${attachments.length ? `
            <section class="panel">
              <h2 class="panel-title">Tệp đính kèm (${attachments.length})</h2>
              <div class="attachment-list">
                ${attachments.map(a => `<span class="attachment-pill">${esc(a.originalName)} <span class="muted">(${esc(formatSize(a.sizeBytes))})</span></span>`).join('')}
              </div>
              <p class="muted" style="margin:8px 0 0;font-size:12px;">Vì lý do bảo mật, tệp đính kèm nội bộ được bảo vệ và không tải trực tiếp từ liên kết công khai.</p>
            </section>
          ` : ''}

          <section class="panel">
            <h2 class="panel-title">
              <span>Trao đổi (${comments.length})</span>
              ${share.hideInternalComments ? '<span class="badge discussion-scope">Chỉ hiện trao đổi công khai</span>' : ''}
            </h2>
            <div class="comment-list">
              ${comments.length ? comments.map(c => `
                <article class="comment-item">
                  <div class="comment-head">
                    <strong>${esc(c.authorName)}</strong>
                    <span class="muted">${esc(formatTime(c.createdAt))}</span>
                  </div>
                  <p class="comment-body">${esc(c.body)}</p>
                </article>
              `).join('') : '<p class="muted" style="margin:0;">Chưa có trao đổi công khai nào.</p>'}
            </div>
            ${canComment ? `
              <form class="compose-grid" id="commentForm">
                <label class="form-field">Tên của bạn hoặc công ty <input class="input" id="guestNameInput" required maxlength="80" value="${esc(guestName)}"></label>
                <label class="form-field">Phản hồi <textarea class="textarea" id="guestCommentInput" required maxlength="5000" rows="3" placeholder="Nhập nội dung phản hồi"></textarea></label>
                <div class="form-actions">
                  <button class="btn primary" type="submit">Gửi phản hồi</button>
                </div>
              </form>
              <div id="commentFeedback" class="share-feedback" role="status" aria-atomic="true"></div>
            ` : ''}
          </section>
        `;

        bindInteractiveHandlers();
      }

      function showFeedback(id, type, message, retry) {
        const feedback = document.getElementById(id);
        if (!feedback) return;
        feedback.replaceChildren();
        if (!message) return;
        const body = document.createElement('div');
        body.className = type === 'error' ? 'error-banner' : 'ok-banner';
        body.textContent = message;
        feedback.append(body);
        if (retry) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'btn';
          button.textContent = 'Tải lại dữ liệu';
          button.addEventListener('click', retry);
          feedback.append(button);
        }
      }

      function refreshTaskView(data) {
        const active = document.activeElement;
        const checkboxId = active?.dataset.checklistId;
        const formId = active?.closest('form')?.id;
        const fields = draftFields.map(id => document.getElementById(id))
          .filter(field => field && (field.matches('select')
            ? !field.selectedOptions[0]?.defaultSelected
            : field.value !== field.defaultValue));
        renderTaskView(data);
        for (const field of fields) {
          const replacement = document.getElementById(field.id);
          if (replacement) replacement.value = field.value;
        }
        const focusTarget = (active?.id && document.getElementById(active.id))
          || (checkboxId && [...root.querySelectorAll('[data-checklist-id]')].find(field => field.dataset.checklistId === checkboxId))
          || (formId && document.getElementById(formId)?.querySelector('button[type="submit"]'));
        focusTarget?.focus({ preventScroll: true });
        if (typeof focusTarget?.setSelectionRange === 'function' && typeof active.selectionStart === 'number') {
          focusTarget.setSelectionRange(active.selectionStart, active.selectionEnd);
        }
      }

      function applyDemoGuestMutation(payload) {
        const state = readDemoShareState();
        if (!state) return false;
        const { matched, dataPack, t } = state;
        const action = payload.guestAction;
        if (action === 'update_progress' && matched.permission === 'edit_progress') {
          if (DEMO_API_TO_STATUS[payload.status]) t.status = DEMO_API_TO_STATUS[payload.status];
          if (Number.isFinite(payload.progress)) t.progress = Math.min(100, Math.max(0, Math.round(payload.progress)));
          if (t.status === 'Hoàn thành') t.progress = 100;
        } else if (action === 'toggle_checklist' && (matched.permission === 'edit_progress' || (matched.permission === 'comment' && matched.allowChecklistToggle))) {
          const idx = Number(payload.itemId);
          if (Array.isArray(t.checklist) && t.checklist[idx]) {
            t.checklist[idx][1] = Boolean(payload.isDone);
            if (t.autoProgress) {
              const done = t.checklist.filter(c => c[1]).length;
              t.progress = t.checklist.length ? Math.round((done / t.checklist.length) * 100) : t.progress;
            }
          }
        } else if (action === 'add_checklist' && (matched.permission === 'edit_progress' || (matched.permission === 'comment' && matched.allowChecklistToggle))) {
          if (!Array.isArray(t.checklist)) t.checklist = [];
          t.checklist.push([String(payload.content || '').slice(0, 400), false]);
        } else if (action === 'add_comment' && (matched.permission === 'comment' || matched.permission === 'edit_progress')) {
          if (!Array.isArray(t.comments)) t.comments = [];
          const numericCommentId = Math.floor(Date.now() * 100 + Math.random() * 99);
          t.comments.push({
            id: numericCommentId,
            authorId: null,
            author: String(payload.guestName || 'Khách').slice(0, 180),
            text: String(payload.body || '').slice(0, 2000),
            at: new Date().toISOString()
          });
        } else {
          throw new Error('Liên kết không cho phép thao tác này.');
        }
        t.updatedAt = new Date().toISOString();
        localStorage.setItem('worktree_x_v8_demo_data', JSON.stringify(dataPack));
        return true;
      }

      async function postGuest(payload) {
        if (demoShareToken) {
          applyDemoGuestMutation(payload);
          return { ok: true };
        }
        const res = await fetch(`/api/share?token=${encodeURIComponent(token)}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(unlockedPin ? { 'X-Share-Pin': unlockedPin } : {})
          },
          body: JSON.stringify({ token, pin: unlockedPin || undefined, ...payload })
        });
        const data = await res.json().catch(() => null);
        if (!res.ok || !data?.ok) {
          throw new Error(res.status < 500 && data?.error || 'Không thể thực hiện thao tác. Vui lòng thử lại.');
        }
        return data;
      }

      async function saveGuestAction({ control, feedback, payload, success, submittedFields = [], restore }) {
        if (isSaving) {
          restore?.();
          return;
        }
        isSaving = true;
        const fields = submittedFields.map(field => [field, field.value]);
        const buttonText = control.textContent;
        const isButton = control.matches('button');
        control.setAttribute('aria-disabled', 'true');
        if (isButton) control.textContent = 'Đang lưu…';
        showFeedback(feedback, '', '');
        try {
          await postGuest(payload);
          for (const [field, submitted] of fields) {
            if (field.value === submitted) {
              const defaultOption = Array.from(field.options || []).find(option => option.defaultSelected);
              field.value = defaultOption?.value ?? field.defaultValue;
            }
          }
          await loadShare({ feedback, success });
        } catch (err) {
          restore?.();
          showFeedback(feedback, 'error', err instanceof TypeError ? 'Không thể kết nối. Vui lòng thử lại.' : err.message);
        } finally {
          isSaving = false;
          control.removeAttribute('aria-disabled');
          if (isButton) control.textContent = buttonText;
        }
      }

      function bindInteractiveHandlers() {
        document.getElementById('progressForm')?.addEventListener('submit', (e) => {
          e.preventDefault();
          if (isSaving) return;
          const status = document.getElementById('guestStatusSelect');
          const progress = document.getElementById('guestProgressInput');
          const nameVal = document.getElementById('progressGuestName').value.trim() || guestName || 'Khách';
          guestName = nameVal;
          localStorage.setItem('worktree_share_guest_name', guestName);
          saveGuestAction({
            control: e.currentTarget.querySelector('button'), feedback: 'progressFeedback',
            payload: { guestAction: 'update_progress', guestName, status: status.value, progress: progress.valueAsNumber },
            success: 'Đã cập nhật tiến độ công việc.', submittedFields: [status, progress, document.getElementById('progressGuestName')]
          });
        });

        root.querySelectorAll('input[data-checklist-id]').forEach(cb => {
          cb.addEventListener('change', () => {
            const itemId = cb.dataset.checklistId;
            const isDone = cb.checked;
            saveGuestAction({
              control: cb, feedback: 'checklistFeedback',
              payload: { guestAction: 'toggle_checklist', guestName: guestName || 'Khách', itemId, isDone },
              success: 'Đã cập nhật checklist.', restore: () => { cb.checked = !isDone; }
            });
          });
        });

        document.getElementById('addChecklistForm')?.addEventListener('submit', (e) => {
          e.preventDefault();
          const input = document.getElementById('newChecklistInput');
          const content = input?.value.trim() || '';
          if (!content) return;
          saveGuestAction({
            control: e.currentTarget.querySelector('button'), feedback: 'checklistFeedback',
            payload: { guestAction: 'add_checklist', guestName: guestName || 'Khách', content },
            success: 'Đã thêm mục checklist.', submittedFields: [input]
          });
        });

        document.getElementById('commentForm')?.addEventListener('submit', (e) => {
          e.preventDefault();
          if (isSaving) return;
          const gName = document.getElementById('guestNameInput')?.value.trim() || '';
          const input = document.getElementById('guestCommentInput');
          const body = input.value.trim();
          if (!gName || !body) return;
          guestName = gName;
          localStorage.setItem('worktree_share_guest_name', guestName);
          saveGuestAction({
            control: e.currentTarget.querySelector('button'), feedback: 'commentFeedback',
            payload: { guestAction: 'add_comment', guestName: gName, body },
            success: 'Đã gửi phản hồi.', submittedFields: [input]
          });
        });
      }

      async function loadShare({ fromPinSubmit = false, feedback, success } = {}) {
        if (demoShareToken) {
          const demoState = readDemoShareState();
          if (!demoState) {
            renderNotFound();
            return false;
          }
          const requiredPin = demoState.matched.pin;
          if (requiredPin && String(unlockedPin || '') !== String(requiredPin)) {
            if (fromPinSubmit) {
              sessionStorage.removeItem(pinStoreKey);
              unlockedPin = '';
              renderPinGate(demoState.payload.share, 'Mã PIN không đúng.');
            } else {
              currentData = { share: demoState.payload.share };
              renderPinGate(demoState.payload.share);
            }
            return false;
          }
          demoState.payload.share.expiresAt = demoState.matched.expiresAt || null;
          if (feedback) {
            refreshTaskView(demoState.payload);
            showFeedback(feedback, 'ok', success);
          } else {
            renderTaskView(demoState.payload);
          }
          return true;
        }
        if (!token) {
          renderNotFound('Thiếu mã liên kết chia sẻ.');
          return;
        }
        try {
          const res = await fetch(`/api/share?token=${encodeURIComponent(token)}`, {
            method: unlockedPin ? 'POST' : 'GET',
            headers: {
              'Content-Type': 'application/json',
              ...(unlockedPin ? { 'X-Share-Pin': unlockedPin } : {})
            },
            ...(unlockedPin ? { body: JSON.stringify({ token, guestAction: 'unlock', pin: unlockedPin }) } : {})
          });
          const data = await res.json().catch(() => null);
          if (res.status === 404) {
            renderNotFound();
            return false;
          }
          if (!res.ok && data?.requiresPin) {
            sessionStorage.removeItem(`wt_share_pin:${token}`);
            unlockedPin = '';
            renderPinGate(currentData?.share || { label: 'Công việc chia sẻ' }, fromPinSubmit ? (data.error || 'Mã PIN không đúng.') : '');
            return false;
          }
          if (!data || res.status >= 500) throw new Error('Không thể kết nối máy chủ WorkTree X.');
          if (data.requiresPin) {
            currentData = data;
            renderPinGate(data.share || {});
            return false;
          }
          if (!res.ok || !data.ok) {
            renderNotFound(data.error);
            return false;
          }
          if (feedback) {
            refreshTaskView(data);
            showFeedback(feedback, 'ok', success);
          } else {
            renderTaskView(data);
          }
          return true;
        } catch {
          if (feedback) {
            showFeedback(feedback, 'error', 'Thao tác đã được lưu. Chưa tải được dữ liệu mới.', async (event) => {
              if (isSaving) return;
              const button = event.currentTarget;
              button.disabled = true;
              isSaving = true;
              try { await loadShare({ feedback, success }); }
              finally { isSaving = false; button.disabled = false; }
            });
          } else if (fromPinSubmit) {
            showFeedback('pinFeedback', 'error', 'Không thể kết nối. Vui lòng thử mở lại.');
          } else {
            renderNotFound('Không thể kết nối máy chủ WorkTree X.', true);
          }
          return false;
        }
      }

      loadShare();
    })();
  </script>
</body>
</html>
